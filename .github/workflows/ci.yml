name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, coverage, and package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run tests, coverage gate, and package verification
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Validate checked-in OpenAPI contract
        run: ruby scripts/validate-openapi.rb docs/openapi.yaml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: Docker image build
    runs-on: ubuntu-22.04
    needs: [ verify, integration ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag auction-engine:ci .

  integration:
    name: PostgreSQL migration integration tests
    runs-on: ubuntu-22.04
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run PostgreSQL/Testcontainers integration tests
        run: mvn --batch-mode --no-transfer-progress -Pintegration verify
